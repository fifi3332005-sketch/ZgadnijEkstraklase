
<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Zgadnij klub Ekstraklasy</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Guess the football club!</h1>

    <p id="licznik">5 Guesses left</p>

    <div class="panel-wpisywania">

        <input type="text"
               id="nazwaKlubu"
               placeholder="Enter the club name..."
               autocomplete="off">

        <div id="podpowiedzi"></div>

    </div>

    <div class="naglowki">
        <div></div>
        <div>City</div>
        <div>Stadium Capacity</div>
        <div>Club Value</div>
        <div>Distance</div>
    </div>

    <div id="historia"></div>

    <script src="script.js"></script>

</body>
</html>
